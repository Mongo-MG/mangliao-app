name: Build MongoLiao APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync project from CDN
        run: |
          curl -L --retry 3 --retry-delay 2 -o project.zip "https://aka.doubaocdn.com/s/fU8XfPCyCc"
          unzip -o -q project.zip -d .
          rm -f project.zip
          echo synced
          ls -1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MongoLiao-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
