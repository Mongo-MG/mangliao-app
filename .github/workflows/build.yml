name: Build MangLiao APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch project
        run: |
          curl -sSL -o project.zip https://aka.doubaocdn.com/s/3vyscmbeUp
          mkdir -p project
          unzip -q project.zip -d project
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Build
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MangLiao-APK
          path: project/app/build/outputs/apk/debug/*.apk
